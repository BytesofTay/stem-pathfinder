name: Review school directory refresh

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check ingestion guards
        run: python -m unittest discover -s tests -p 'test_update_schools.py' -v
      - name: Fetch and validate official CDE directory
        run: python update_schools.py
      - name: Prepare reviewable diff
        run: git diff -- lausd_magnet_app/web/schools_data.js > school-directory.diff
      - name: Upload proposed snapshot, provenance, and diff for review
        uses: actions/upload-artifact@v4
        with:
          name: school-directory-review-${{ github.run_id }}
          path: |
            lausd_magnet_app/web/schools_data.js
            school-update-report.json
            school-directory.diff
          retention-days: 30
          if-no-files-found: error
